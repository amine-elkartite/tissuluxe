<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Produit admin - TissuLuxe</title><link rel="stylesheet" href="css/admin.css"></head><body><div class="admin-shell"><aside class="sidebar"><a class="brand" href="dashboard.html"><img src="../tissuluxe_web/images/logo-tissuluxe.png" alt=""><span>Tissu<span>Luxe</span></span></a><nav class="nav"><a class="" href="dashboard.html">Dashboard</a><a class="active" href="products.html">Produits</a><a class="" href="orders.html">Commandes</a><a class="" href="users.html">Clients</a><a class="" href="categories.html">Catégories</a><a class="" href="coupons.html">Coupons</a><a class="" href="messages.html">Messages</a><a class="" href="settings.html">Réglages</a><button class="logout" data-admin-logout>Déconnexion</button></nav></aside><main class="admin-main"><div class="topbar"><h1>Ajouter un produit</h1></div><form class="panel form" data-product-form><input name="name" placeholder="Nom" required><select name="category_id" data-category-options></select><input name="price" type="number" step="0.01" placeholder="Prix" required><input name="old_price" type="number" step="0.01" placeholder="Ancien prix"><input name="stock" type="number" placeholder="Stock" required><input name="sku" placeholder="SKU"><input name="main_image" value="images/products/fabric-01.jpg" placeholder="Image principale"><input name="material" placeholder="Matière"><input name="width" placeholder="Largeur"><input name="pattern" placeholder="Motif"><textarea class="wide" name="description" placeholder="Description"></textarea><label><input type="checkbox" name="featured" value="1"> Produit en vedette</label><select name="status"><option value="active">Actif</option><option value="inactive">Inactif</option></select><button class="btn">Enregistrer</button></form></main></div><script src="js/admin.js"></script></body></html>
